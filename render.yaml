# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repo.
# Both services are created and wired to each other automatically; only
# MONGO_URL has to be entered by hand.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: apna-video-call-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    # Reports 503 until Mongo is actually connected, so a deploy that cannot
    # reach the database fails instead of going live broken.
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Secret: set in the dashboard, never committed.
      - key: MONGO_URL
        sync: false
      # Generated once by Render and kept across deploys. Changing it signs
      # every user out.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Points at the static site below, so CORS needs no manual URL.
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: apna-video-call-web
          property: host
      # Optional TURN relay for peers behind symmetric NAT. Left unset means
      # STUN only. Credentials stay server-side and are served via /api/v1/ice.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  # --------------------------------------------------------------- frontend
  - type: web
    name: apna-video-call-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "20"
      # CRA inlines this at BUILD time, so changing it requires a rebuild.
      - key: REACT_APP_SERVER_URL
        fromService:
          type: web
          name: apna-video-call-api
          property: host
    routes:
      # Client-side routing: every unknown path must serve index.html, or
      # refreshing on /room/<code> returns 404 instead of the meeting.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
